# stage0_rules.yaml — правила Stage 0 (жёсткий reject) + hint для Stage 1
# Версия: v1.0 (30.10.2026)
# Владелец content: Эксперт, версионирование: Агент
#
# ВАЖНО: Stage 0 НЕ выбирает профиль резюме. Он только reject/pass.
# Если pass — Stage 1 видит ВСЕ 4 summary + hint (если есть) + вакансию.

# ============================================================================
# REJECT — жёсткие фильтры. Если срабатывает → rejected_by_filter, LLM не вызывается.
# ============================================================================

reject:
  # Junior / стажёр / ассистент — отсекается в search_worker (pre-filter)
  junior_title_keywords:
    - junior
    - стажёр
    - стажер
    - ассистент
    - помощник
    - trainee
    - intern

  # Salary hard-min: ниже 250K — reject (целевой уровень: от 280K)
  salary_hard_min: 250000
  salary_hard_min_currency: RUB

  # Experience filters: только 3-6 и 6+ (1-3 года — overqualified, reject)
  experience_filters_allowed:
    - "от 3 до 6 лет"
    - "более 6 лет"

  # Excluded positions — роли, которые не подходят ни одному профилю
  excluded_positions:
    - "Scrum Master (чистый коучинг команд без управления проектами)"
    - "администратор проектов"
    - "Разработчик"
    - "DevOps"
    - "Системный администратор"
    - "1С-конфигуратор"
    - "Внедренец ERP на базе 1С (полный цикл внедрения)"
    - "Инженер технической поддержки L1/L2/L3 (без руководящей роли)"
    - "Специалист по ИБ (управление ИБ-проектами)"
    - "PKI-инженер"
    - "Инженер по AI-платформам (LLM, RAG, векторные БД, prompt engineering как основная функция)"

  # Excluded companies — компании, где уже был отказ или нет смысла
  excluded_companies:
    - "The_covert"
    - "Оптимакрос"
    - "YOLKA"
    - "Piklema"
    - "Домклик (аренда)"
    - "Авто Финанс Банк"
    - "Гута-Клиник"
    - "Oxygen Data Centers"
    - "СИБИНТЕК (PKI)"
    - "Т1 (эквайринг)"
    - "Моторинвест"
    - "Автобан"
    - "Aston"
    - "ФГАУ НИИ «Восход»"

  # Excluded keywords — если встречаются в title или описании (жёстко)
  excluded_keywords:
    - "РКО"
    - "расчётно-кассовое обслуживание"
    - "эквайринг"
    - "PKI"
    - "1С:ERP внедрение"
    - "администрирование серверов"
    - "администрирование сетей"
    - "AD / GPO / VDI / Citrix / KSC как экспертное требование"
    - "вентиляц"
    - "пожарн"
    - "Честный знак"
    - "маркировк"
    - "IPMA (как обязательная сертификация)"
    - "C2 / свободный английский как обязательное требование"
    - "декретная ставка"
    - "фармацевт"

# ============================================================================
# HINT — подсказки для Stage 1 (НЕ жёсткие правила, НЕ выбор профиля).
# Если вакансия содержит keyword — Stage 1 обращает внимание на likely_profile.
# Но решение — по трём «да» (роль + домен + грейд), а не по keyword.
# Если hint не сработал — Stage 1 решает сам, без подсказки.
# ============================================================================

hint:
  - keywords: ["engineering manager", "team lead", "tech lead"]
    likely_profile: ["RSP", "RP"]
    comment: "Engineering/Team Lead — чаще сервис или универсальный PM"

  - keywords: ["program manager", "program lead"]
    likely_profile: ["RP", "RPO"]
    comment: "Program Manager — PM или PMO"

  - keywords: ["ITIL", "SLA", "Service Desk", "инциденты", "2-я линия", "поддержка"]
    likely_profile: ["RSP", "ROP"]
    comment: "Сервисные роли — RSP или ROP"

  - keywords: ["PMO", "портфель", "методология", "проектный офис"]
    likely_profile: ["RPO", "RP"]
    comment: "PMO — RPO или RP"

  - keywords: ["поддержка", "мониторинг", "24/7", "база знаний", "Service Desk"]
    likely_profile: ["ROP"]
    comment: "Чистый Service Desk — ROP"

  - keywords: ["Senior PM", "Руководитель проектов внедрения", "Delivery Manager"]
    likely_profile: ["RP", "RPO"]
    comment: "Внедрение и Delivery — RP"

  - keywords: ["Руководитель поддержки", "Начальник отдела сопровождения", "Service Manager"]
    likely_profile: ["RSP", "ROP"]
    comment: "Руководство поддержкой — RSP или ROP"

  - keywords: ["Методолог", "PMO"]
    likely_profile: ["RPO", "RP"]
    comment: "Методология — RPO"

  - keywords: ["ITIL", "PMO"]
    likely_profile: ["RSP", "RPO"]
    comment: "Пересечение ITIL/PMO"

  - keywords: ["финанс", "1С", "Банк России", "налог", "платеж", "SOAP", "СМЭВ"]
    likely_profile: ["RSP", "ROP", "RPO"]
    comment: "Финансы/1С/Банк России — сервис или PMO"

  - keywords: ["менеджер проектов", "управление проектами", "проекты внедрения", "несколько проектов", "параллельных проектов", "project manager", "delivery manager", "project lead"]
    likely_profile: ["RP"]
    comment: "Универсальные PM-роли — RP"

# ============================================================================
# DEFAULT — отсутствует.
# В новой архитектуре нет «default: RP». Если hint не сработал —
# Stage 1 видит все 4 summary и решает по трём «да» (роль + домен + грейд).
# ============================================================================
